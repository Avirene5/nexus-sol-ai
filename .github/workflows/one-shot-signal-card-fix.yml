name: One-shot signal card fix

on:
  push:
    paths:
      - '.ui-signal-card-fix'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch signal cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''\n.signal-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;color:#8ca0b7;font-size:9px}.signal-meta span{padding:4px 7px;border:1px solid #1b3140;border-radius:999px;background:#09151a}.signal-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.signal-links a,.signal-links button{border:1px solid #263750;background:#0b1525;color:#b9d7ea;padding:6px 8px;border-radius:8px;font-size:8px;font-weight:900;text-decoration:none;cursor:pointer}.signal-links a:hover,.signal-links button:hover{border-color:#5ee7ff;color:#fff}.signal-time{color:#71839b;font-size:8px;margin-top:7px}.signal-address{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#7189a4;font-size:8px;margin-top:7px}.signal-address b{color:#a9c2da;font-weight:800}@media(max-width:650px){.signal-address{font-size:8px}.signal-links a,.signal-links button{font-size:8px;padding:7px 8px}}\n'''
          if '.signal-address{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          old = re.search(r'function renderSignals\(d\)\{.*?\}\nfunction renderCandidates', s, re.S)
          if not old:
              raise SystemExit('renderSignals function not found')

          new = '''function renderSignals(d){const el=document.getElementById('signalBoard'),arr=(d.signals||[]).slice(0,6);const short=a=>a?(a.slice(0,8)+'…'+a.slice(-6)):'N/A';const copy=a=>{if(!a)return;navigator.clipboard?.writeText(a).catch(()=>{});};const when=t=>t?time(t):'N/A';el.innerHTML=arr.length?arr.map(x=>{const a=x.address||x.mint||'';const sol='https://solscan.io/token/'+encodeURIComponent(a);const dex='https://dexscreener.com/solana/'+encodeURIComponent(a);return `<article class="signal"><div class="srow"><b>${esc(x.symbol)}</b><b class="score">${fmt(x.score)}</b></div><small>${esc(x.liquidity)} · momentum ${fmt(x.momentum)} · <b>${esc(x.decision)}</b></small><small>${esc(x.reason)}</small><div class="signal-address"><b>Mint:</b> ${esc(short(a))}</div><div class="signal-meta"><span>Signal ${esc(when(x.timestamp))}</span><span>Paper / Simulation</span></div><div class="signal-links"><button type="button" data-copy="${esc(a)}">Copy address</button><a href="${sol}" target="_blank" rel="noopener noreferrer">Solscan</a><a href="${dex}" target="_blank" rel="noopener noreferrer">DexScreener</a></div></article>`}).join(''):'<article class="signal"><b>No active 85+ signal</b><small>Monitoring continues in Paper / Simulation.</small></article>';el.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copy)));}\nfunction renderCandidates'''
          s = s[:old.start()] + new + s[old.end():]

          # Make the candidate Mint explicitly labeled and copyable too.
          s = s.replace("<span class=\"mint\">${esc(x.mint)}</span>", "<span class=\"mint\">Mint: ${esc(x.mint)}</span>")

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'Copy address' index.html
          grep -q 'Solscan' index.html
          grep -q 'DexScreener' index.html
          grep -q 'signal-time\|Signal ' index.html
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .ui-signal-card-fix .github/workflows/one-shot-signal-card-fix.yml
          git commit -m 'fix signal cards with mint links and timestamps'
          git push
