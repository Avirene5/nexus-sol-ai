name: Sync AVIRENE5 Live Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-avirene5-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download and validate latest AVIRENE5 telemetry
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --retry 4 --retry-delay 2 -L -o /tmp/dashboard.json "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/dashboard.json"
          curl --fail --retry 4 --retry-delay 2 -L -o /tmp/improvement.json "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/improvement.json"
          curl --fail --retry 4 --retry-delay 2 -L -o /tmp/scan_heartbeat.json "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/scan_heartbeat.json"
          curl --fail --retry 4 --retry-delay 2 -L -o /tmp/research_validation.json "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/research_validation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          def parse_ts(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          incoming = {}
          for name in ("dashboard.json", "improvement.json", "scan_heartbeat.json", "research_validation.json"):
              p = Path("/tmp") / name
              data = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"Invalid telemetry payload: {name}")
              incoming[name] = data

          dashboard = incoming["dashboard.json"]
          engine = dashboard.get("engine") or {}
          source_generated = parse_ts(dashboard.get("generated_at"))
          source_scan = parse_ts(engine.get("last_scan"))
          if engine.get("name") != "AVIRENE5":
              raise SystemExit("Unexpected dashboard engine")
          if source_generated is None:
              raise SystemExit("Missing or invalid dashboard generated_at")
          if source_scan is None:
              raise SystemExit("Missing or invalid dashboard engine.last_scan")

          validation = incoming["research_validation.json"]
          if validation.get("mode") != "PAPER / SIMULATION":
              raise SystemExit("Unexpected validation mode")
          safety = validation.get("safety") or {}
          if float(safety.get("core_gate", 0)) != 85.0:
              raise SystemExit("RESEARCH_VALIDATION_ERROR: core gate changed")
          if safety.get("automatic_weight_changes") is not False:
              raise SystemExit("RESEARCH_VALIDATION_ERROR: automatic weight changes enabled")
          if safety.get("automatic_gate_lowering") is not False:
              raise SystemExit("RESEARCH_VALIDATION_ERROR: automatic gate lowering enabled")
          if safety.get("auto_trading") is not False:
              raise SystemExit("RESEARCH_VALIDATION_ERROR: auto trading enabled")

          current_path = Path("data/dashboard.json")
          current = json.loads(current_path.read_text(encoding="utf-8")) if current_path.exists() else {}
          current_generated = parse_ts(current.get("generated_at"))
          if current_generated and source_generated < current_generated:
              raise SystemExit(
                  f"STALE_SOURCE: incoming generated_at={source_generated.isoformat()} "
                  f"is older than Nexus={current_generated.isoformat()}"
              )

          for name, data in incoming.items():
              Path("data", name).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print("AVIRENE5 last_scan:", engine.get("last_scan"))
          print("AVIRENE5 generated_at:", dashboard.get("generated_at"))
          print("Validation status:", (validation.get("signal_integrity") or {}).get("status"))
          print("Nexus previous generated_at:", current.get("generated_at"))
          PY

      - name: Publish latest telemetry
        run: |
          set -euo pipefail
          git config user.name "Nexus SOL AI Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/improvement.json data/scan_heartbeat.json data/research_validation.json
          if git diff --cached --quiet; then
            echo "Nexus telemetry already current."
            exit 0
          fi
          git commit -m "Sync AVIRENE5 validation telemetry"
          git push origin main

      - name: Verify published dashboard
        run: |
          set -euo pipefail
          expected=$(python - <<'PY'
          import json
          print(json.load(open("data/dashboard.json", encoding="utf-8"))["generated_at"])
          PY
          )
          for attempt in 1 2 3 4 5; do
            actual=$(curl --fail --retry 2 -L -sS "https://raw.githubusercontent.com/Avirene5/nexus-sol-ai/main/data/dashboard.json" | python -c 'import json,sys; print(json.load(sys.stdin).get("generated_at", ""))')
            echo "Attempt $attempt: expected=$expected actual=$actual"
            if [ "$actual" = "$expected" ]; then
              echo "Nexus live-data synchronization verified."
              exit 0
            fi
            sleep 5
          done
          echo "NEXUS_SYNC_ERROR: published dashboard did not converge to expected telemetry."
          exit 1

      - name: Send one-shot Telegram test
        if: hashFiles('.telegram-test-pending') != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$BOT_TOKEN" ]] || { echo 'TELEGRAM_CONFIG_ERROR: TELEGRAM_BOT_TOKEN is missing'; exit 1; }
          [[ -n "$CHAT_ID" ]] || { echo 'TELEGRAM_CONFIG_ERROR: TELEGRAM_CHAT_ID is missing'; exit 1; }
          BASE="https://api.telegram.org/bot${BOT_TOKEN}"
          GETME=$(curl --fail-with-body --silent --show-error "$BASE/getMe") || { echo 'TELEGRAM_API_ERROR: getMe failed'; exit 1; }
          echo "$GETME" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'), d; r=d['result']; print('Telegram bot verified:', '@'+r.get('username','<no-username>'), '/', r.get('first_name','<no-name>'))"
          TEXT='🟣 NEXUS SOL AI — TEST SIGNAL\n\n✅ Telegram delivery test\n🎯 Demo Score: 91.20\n🟢 CORE GATE: 85+\n📡 Mode: PAPER / SIMULATION\n\nThis is a DEMO only — no trade was executed.'
          RESP=$(curl --fail-with-body --silent --show-error -X POST "$BASE/sendMessage" --data-urlencode "chat_id=$CHAT_ID" --data-urlencode "text=$TEXT") || { echo 'TELEGRAM_API_ERROR: sendMessage failed'; exit 1; }
          echo "$RESP" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'), d; print('Telegram delivery verified. message_id=', d['result']['message_id'])"

      - name: Clear completed Telegram test marker
        if: success() && hashFiles('.telegram-test-pending') != ''
        run: |
          set -euo pipefail
          rm -f .telegram-test-pending
          git config user.name "Nexus SOL AI Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .telegram-test-pending
          git commit -m "Complete Nexus SOL AI Telegram test"
          git push origin main
