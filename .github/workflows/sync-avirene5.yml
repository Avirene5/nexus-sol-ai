# Nexus live-data sync: dashboard + 85+ alert history are published together.
# Recovery trigger: restore live telemetry after dashboard regression.
# Force a fresh synchronization after AVIRENE5 dashboard recovery.
# Manual recovery touch: trigger the existing sync workflow without changing sync logic.
name: Sync AVIRENE5 Live Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-avirene5.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-avirene5-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download and validate latest AVIRENE5 telemetry
        run: |
          set -euo pipefail
          mkdir -p data
          for name in dashboard.json improvement.json scan_heartbeat.json research_validation.json alert_history.json; do
            curl --fail --retry 4 --retry-delay 2 -L -o "/tmp/$name" "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/$name"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          def parse_ts(value):
              if not value: return None
              try:
                  dt=datetime.fromisoformat(str(value).replace("Z","+00:00"))
                  return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
              except Exception: return None
          incoming={}
          for name in ("dashboard.json","improvement.json","scan_heartbeat.json","research_validation.json"):
              data=json.loads((Path("/tmp")/name).read_text(encoding="utf-8"))
              if not isinstance(data,dict): raise SystemExit(f"Invalid telemetry payload: {name}")
              incoming[name]=data
          history=json.loads(Path("/tmp/alert_history.json").read_text(encoding="utf-8"))
          if not isinstance(history,list): raise SystemExit("Invalid alert_history.json payload")
          incoming["alert_history.json"]=history
          dashboard=incoming["dashboard.json"]
          engine=dashboard.get("engine") or {}
          source_generated=parse_ts(dashboard.get("generated_at"))
          source_scan=parse_ts(engine.get("last_scan"))
          heartbeat=incoming["scan_heartbeat.json"]
          heartbeat_scan=parse_ts(heartbeat.get("scan_completed_at"))
          if engine.get("name")!="AVIRENE5": raise SystemExit("Unexpected dashboard engine")
          if source_generated is None: raise SystemExit("Missing or invalid dashboard generated_at")
          if source_scan is None: raise SystemExit("Missing or invalid dashboard engine.last_scan")
          if heartbeat_scan is None: raise SystemExit("Missing or invalid scan heartbeat")
          freshness_delta=abs((source_scan-heartbeat_scan).total_seconds())
          if freshness_delta > 120:
              raise SystemExit(f"NEXUS_SOURCE_FRESHNESS_ERROR: dashboard.last_scan={source_scan.isoformat()} heartbeat={heartbeat_scan.isoformat()} delta_seconds={freshness_delta:.0f}")
          validation=incoming["research_validation.json"]
          if validation.get("mode")!="PAPER / SIMULATION": raise SystemExit("Unexpected validation mode")
          safety=validation.get("safety") or {}
          if float(safety.get("core_gate",0))!=85.0: raise SystemExit("RESEARCH_VALIDATION_ERROR: core gate changed")
          if safety.get("automatic_weight_changes") is not False: raise SystemExit("RESEARCH_VALIDATION_ERROR: automatic weight changes enabled")
          if safety.get("automatic_gate_lowering") is not False: raise SystemExit("RESEARCH_VALIDATION_ERROR: automatic gate lowering enabled")
          if safety.get("auto_trading") is not False: raise SystemExit("RESEARCH_VALIDATION_ERROR: auto trading enabled")
          current_path=Path("data/dashboard.json")
          current=json.loads(current_path.read_text(encoding="utf-8")) if current_path.exists() else {}
          current_generated=parse_ts(current.get("generated_at"))
          if current_generated and source_generated<current_generated:
              raise SystemExit(f"STALE_SOURCE: incoming generated_at={source_generated.isoformat()} is older than Nexus={current_generated.isoformat()}")
          for name,data in incoming.items():
              (Path("data")/name).write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("AVIRENE5 last_scan:",engine.get("last_scan"))
          print("AVIRENE5 generated_at:",dashboard.get("generated_at"))
          print("AVIRENE5 persisted 85+ alerts:",len(history))
          print("Validation status:",(validation.get("signal_integrity") or {}).get("status"))
          print("Nexus previous generated_at:",current.get("generated_at"))
          PY
      - name: Publish latest telemetry
        run: |
          set -euo pipefail
          git config user.name "Nexus SOL AI Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/improvement.json data/scan_heartbeat.json data/research_validation.json data/alert_history.json
          if git diff --cached --quiet; then echo "Nexus telemetry already current."; exit 0; fi
          git commit -m "Sync AVIRENE5 live data and alert history"
          git push origin main
      - name: Verify published dashboard and alert history
        run: |
          set -euo pipefail
          expected=$(python -c 'import json; print(json.load(open("data/dashboard.json",encoding="utf-8"))["generated_at"])')
          expected_history=$(python -c 'import json; print(len(json.load(open("data/alert_history.json",encoding="utf-8"))))')
          for attempt in 1 2 3 4 5; do
            actual=$(curl --fail --retry 2 -L -sS "https://raw.githubusercontent.com/Avirene5/nexus-sol-ai/main/data/dashboard.json" | python -c 'import json,sys; print(json.load(sys.stdin).get("generated_at",""))')
            actual_history=$(curl --fail --retry 2 -L -sS "https://raw.githubusercontent.com/Avirene5/nexus-sol-ai/main/data/alert_history.json" | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
            echo "Attempt $attempt: expected=$expected actual=$actual history=$actual_history/$expected_history"
            if [ "$actual" = "$expected" ] && [ "$actual_history" = "$expected_history" ]; then echo "Nexus live-data and 85+ alert-history synchronization verified."; exit 0; fi
            sleep 5
          done
          echo "NEXUS_SYNC_ERROR: published dashboard or alert history did not converge to expected telemetry."; exit 1
      - name: Sync heartbeat
        run: echo "Nexus AVIRENE5 sync workflow triggered at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Send one-shot Telegram test
        if: hashFiles('.telegram-test-pending') != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$BOT_TOKEN" ]] || { echo 'TELEGRAM_CONFIG_ERROR: TELEGRAM_BOT_TOKEN is missing'; exit 1; }
          [[ -n "$CHAT_ID" ]] || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }
          BASE="https://api.telegram.org/bot${BOT_TOKEN}"
          curl --fail-with-body --silent --show-error "$BASE/getMe" >/dev/null || { echo 'TELEGRAM_API_ERROR: getMe failed'; exit 1; }
          TEXT='🟣 NEXUS SOL AI — TEST SIGNAL\n\n✅ Telegram delivery test\n🎯 Demo Score: 91.20\n🟢 CORE GATE: 85+\n📡 Mode: PAPER / SIMULATION\n\nThis is a DEMO only — no trade was executed.'
          RESP=$(curl --fail-with-body --silent --show-error -X POST "$BASE/sendMessage" --data-urlencode "chat_id=$CHAT_ID" --data-urlencode "text=$TEXT") || { echo 'TELEGRAM_API_ERROR: sendMessage failed'; exit 1; }
          echo "$RESP" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'), d; print('Telegram delivery verified. message_id=',d['result']['message_id'])"
      - name: Clear completed Telegram test marker
        if: success() && hashFiles('.telegram-test-pending') != ''
        run: |
          rm -f .telegram-test-pending
          git config user.name "Nexus SOL AI Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .telegram-test-pending
          git commit -m "Complete Nexus SOL AI Telegram test"
          git push origin main
