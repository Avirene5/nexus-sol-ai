name: Sync AVIRENE5 Live Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-avirene5-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download latest AVIRENE5 telemetry
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --retry 4 --retry-delay 2 -L \
            -o /tmp/dashboard.json \
            "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/dashboard.json"
          curl --fail --retry 4 --retry-delay 2 -L \
            -o /tmp/improvement.json \
            "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/improvement.json"
          curl --fail --retry 4 --retry-delay 2 -L \
            -o /tmp/scan_heartbeat.json \
            "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/scan_heartbeat.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          def parse_ts(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          for name in ("dashboard.json", "improvement.json", "scan_heartbeat.json"):
              p = Path("/tmp") / name
              data = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"Invalid telemetry payload: {name}")
              p.replace(Path("data") / name)

          dashboard = json.loads(Path("data/dashboard.json").read_text(encoding="utf-8"))
          engine = dashboard.get("engine") or {}
          source_generated = parse_ts(dashboard.get("generated_at"))
          source_scan = parse_ts(engine.get("last_scan"))
          if engine.get("name") != "AVIRENE5":
              raise SystemExit("Unexpected dashboard engine")
          if source_generated is None:
              raise SystemExit("Missing or invalid dashboard generated_at")
          if source_scan is None:
              raise SystemExit("Missing or invalid dashboard engine.last_scan")

          current_path = Path("data/dashboard.json")
          current = json.loads(current_path.read_text(encoding="utf-8")) if current_path.exists() else {}
          current_generated = parse_ts(current.get("generated_at"))
          if current_generated and source_generated < current_generated:
              raise SystemExit(
                  f"STALE_SOURCE: incoming generated_at={source_generated.isoformat()} "
                  f"is older than Nexus={current_generated.isoformat()}"
              )

          print("AVIRENE5 last_scan:", engine.get("last_scan"))
          print("AVIRENE5 generated_at:", dashboard.get("generated_at"))
          print("Nexus previous generated_at:", current.get("generated_at"))
          PY

      - name: Publish latest telemetry
        run: |
          set -euo pipefail
          git config user.name "Nexus SOL AI Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/improvement.json data/scan_heartbeat.json
          if git diff --cached --quiet; then
            echo "Nexus telemetry already current."
            exit 0
          fi
          git commit -m "Sync latest AVIRENE5 live telemetry"
          git push origin main

      - name: Verify published dashboard
        run: |
          set -euo pipefail
          expected=$(python - <<'PY'
          import json
          print(json.load(open("data/dashboard.json", encoding="utf-8"))["generated_at"])
          PY
          )
          for attempt in 1 2 3 4 5; do
            actual=$(curl --fail --retry 2 -L -sS \
              "https://raw.githubusercontent.com/Avirene5/nexus-sol-ai/main/data/dashboard.json" \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("generated_at", ""))')
            echo "Attempt $attempt: expected=$expected actual=$actual"
            if [ "$actual" = "$expected" ]; then
              echo "Nexus live-data synchronization verified."
              exit 0
            fi
            sleep 5
          done
          echo "NEXUS_SYNC_ERROR: published dashboard did not converge to expected telemetry."
          exit 1
