name: Sync Nexus Watch Alerts

# Force an immediate sync on workflow changes; scheduled sync remains every 5 minutes.

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-watch-alerts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-watch-alerts-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Download latest watch alerts
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --retry 4 --retry-delay 2 -L -o data/watch_alerts.json "https://raw.githubusercontent.com/Avirene5/solana-ai-signal-engine/main/data/watch_alerts.json"
          python - <<'PY'
          import json
          p='data/watch_alerts.json'
          d=json.load(open(p,encoding='utf-8'))
          if not isinstance(d,dict): raise SystemExit('Invalid watch_alerts payload')
          if not isinstance(d.get('early_entry'),list): raise SystemExit('Invalid early_entry payload')
          if not isinstance(d.get('reversal_watch'),list): raise SystemExit('Invalid reversal_watch payload')
          print('Watch alerts validated:', len(d['early_entry']), 'early;', len(d['reversal_watch']), 'reversal')
          PY

      - name: Publish watch alerts
        run: |
          git config user.name "Nexus SOL AI Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch_alerts.json
          if git diff --cached --quiet; then echo "Watch alerts already current."; exit 0; fi
          git commit -m "Sync early and reversal watch alerts"
          git push origin main
