name: Nexus Multisource Wallet Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nexus-multisource-wallet-discovery
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Require real Birdeye credential
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BIRDEYE_API_KEY" ]; then
            echo "DISCOVERY_ERROR: BIRDEYE_API_KEY is not configured. No fake data will be generated."
            exit 1
          fi

      - name: Run real multisource discovery
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: python scripts/birdeye_wallet_discovery.py

      - name: Run deep wallet research
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: python scripts/deep_wallet_research.py

      - name: Run real forward-performance research
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: python scripts/forward_wallet_performance.py

      - name: Validate provenance and fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/wallet_discovery_multisource.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("real_api_records") is True
          assert d.get("chain") == "solana"
          assert d.get("mode") == "DISCOVERY_ONLY"
          assert d.get("verification_status") == "NOT_VERIFIED"
          assert isinstance(d.get("candidates"), list)
          assert isinstance(d.get("provider_status"), dict)
          for row in d["candidates"]:
              assert row.get("wallet")
              assert row.get("sources")
              for source in row["sources"]:
                  assert source.get("provider")
                  assert source.get("endpoint")
                  assert source.get("observed_at")
          f=Path("data/wallet_forward_performance.json")
          fd=json.loads(f.read_text(encoding="utf-8"))
          assert fd.get("real_api_records") is True
          assert fd.get("mode") == "FORWARD_PERFORMANCE_RESEARCH"
          assert fd.get("source_endpoint") == "/defi/historical_price_unix"
          assert fd.get("synthetic_values") == 0
          deep=Path("data/wallet_deep_research.json")
          dd=json.loads(deep.read_text(encoding="utf-8"))
          assert dd.get("real_api_records") is True
          assert dd.get("mode") == "DEEP_WALLET_RESEARCH"
          assert dd.get("synthetic_values") == 0
          assert dd.get("verification_status") == "NOT_VERIFIED"
          print("Provenance validation passed.")
          print("Real candidate wallets:", d.get("candidate_wallet_count"))
          print("Deep wallets:", dd.get("wallets_researched"))
          print("Forward events:", fd.get("events_selected"))
          print("Matured checkpoints:", fd.get("matured_checkpoints"))
          print("Synthetic values:", fd.get("synthetic_values"))
          PY

      - name: Publish real research datasets
        run: |
          set -euo pipefail
          git config user.name "Nexus SOL AI Discovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallet_discovery_multisource.json data/wallet_deep_research.json data/wallet_forward_performance.json
          if git diff --cached --quiet; then
            echo "No new research dataset changes."
            exit 0
          fi
          git commit -m "Update deep wallet research and forward performance datasets"
          git push origin main
