name: Nexus Multisource Wallet Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - "scripts/birdeye_wallet_discovery.py"
      - "scripts/vybe_wallet_crosscheck.py"
      - "scripts/wallet_identity_funding.py"
      - "scripts/deep_wallet_research.py"
      - "scripts/forward_wallet_performance.py"
      - "scripts/wallet_evidence_engine.py"
      - "scripts/wallet_cluster_engine.py"
      - "scripts/wallet_forward_validation_v3.py"
      - ".github/workflows/multisource-wallet-discovery.yml"

permissions:
  contents: write

concurrency:
  group: nexus-multisource-wallet-discovery
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Require real Birdeye credential
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BIRDEYE_API_KEY" ]; then
            echo "DISCOVERY_ERROR: BIRDEYE_API_KEY is not configured. No fake data will be generated."
            exit 1
          fi

      - name: Run real multisource discovery
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
        run: python scripts/birdeye_wallet_discovery.py

      - name: Run independent Vybe cross-check
        env:
          VYBE_API_KEY: ${{ secrets.VYBE_API_KEY }}
        run: python scripts/vybe_wallet_crosscheck.py

      - name: Run wallet identity and funding provenance
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: python scripts/wallet_identity_funding.py

      - name: Run deep wallet research
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: python scripts/deep_wallet_research.py

      - name: Run real forward-performance research
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: python scripts/forward_wallet_performance.py

      - name: Build independence-adjusted evidence
        run: python scripts/wallet_evidence_engine.py

      - name: Build conservative wallet clusters
        run: python scripts/wallet_cluster_engine.py

      - name: Run event-level walk-forward validation
        run: python scripts/wallet_forward_validation_v3.py

      - name: Validate provenance and fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/wallet_discovery_multisource.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("real_api_records") is True
          assert d.get("chain") == "solana"
          assert d.get("mode") == "DISCOVERY_ONLY"
          assert d.get("verification_status") == "NOT_VERIFIED"
          assert isinstance(d.get("candidates"), list)
          assert isinstance(d.get("provider_status"), dict)
          for row in d["candidates"]:
              assert row.get("wallet")
              assert row.get("sources")
              for source in row["sources"]:
                  assert source.get("provider")
                  assert source.get("endpoint")
                  assert source.get("observed_at")
          v=Path("data/wallet_vybe_crosscheck.json")
          vd=json.loads(v.read_text(encoding="utf-8"))
          assert vd.get("synthetic_values") == 0
          assert vd.get("verification_status") == "NOT_VERIFIED"
          if vd.get("provider_status") == "ENABLED":
              assert vd.get("real_api_records") is True
          f=Path("data/wallet_forward_performance.json")
          fd=json.loads(f.read_text(encoding="utf-8"))
          assert fd.get("real_api_records") is True
          assert fd.get("mode") == "FORWARD_PERFORMANCE_RESEARCH"
          assert fd.get("source_endpoint") == "/defi/historical_price_unix"
          assert fd.get("synthetic_values") == 0
          deep=Path("data/wallet_deep_research.json")
          dd=json.loads(deep.read_text(encoding="utf-8"))
          assert dd.get("real_api_records") is True
          assert dd.get("mode") == "DEEP_WALLET_RESEARCH"
          assert dd.get("synthetic_values") == 0
          assert dd.get("verification_status") == "NOT_VERIFIED"
          ident=Path("data/wallet_identity_funding.json")
          idd=json.loads(ident.read_text(encoding="utf-8"))
          assert idd.get("real_api_records") is True
          assert idd.get("mode") == "WALLET_IDENTITY_FUNDING_RESEARCH"
          assert idd.get("synthetic_values") == 0
          assert idd.get("verification_status") == "NOT_VERIFIED"
          ev=Path("data/wallet_evidence.json")
          ed=json.loads(ev.read_text(encoding="utf-8"))
          assert ed.get("real_api_records") is True
          assert ed.get("synthetic_values") == 0
          assert ed.get("mode") == "WALLET_EVIDENCE"
          cl=Path("data/wallet_clusters.json")
          cd=json.loads(cl.read_text(encoding="utf-8"))
          assert cd.get("synthetic_values") == 0
          assert cd.get("verification_status") == "NOT_VERIFIED"
          assert cd.get("relationship_inference") == "CONSERVATIVE_EXPLICIT_EVIDENCE_ONLY"
          wf=Path("data/wallet_forward_validation_v3.json")
          wd=json.loads(wf.read_text(encoding="utf-8"))
          assert wd.get("synthetic_values") == 0
          assert wd.get("verification_status") == "NOT_VERIFIED"
          assert wd.get("method") == "EVENT_LEVEL_EXPANDING_MULTI_WINDOW_WALK_FORWARD"
          assert wd.get("real_api_records") is True
          print("Provenance validation passed.")
          print("Real candidate wallets:", d.get("candidate_wallet_count"))
          print("Vybe status:", vd.get("provider_status"))
          print("Vybe rows:", len(vd.get("rows", [])))
          print("Identity/funding wallets:", idd.get("wallets_enriched"))
          print("Deep wallets:", dd.get("wallets_researched"))
          print("Forward events:", fd.get("events_selected"))
          print("Matured checkpoints:", fd.get("matured_checkpoints"))
          print("Evidence wallets:", ed.get("candidate_count"))
          print("Clusters:", cd.get("cluster_count"))
          print("Multi-wallet clusters:", cd.get("multi_wallet_cluster_count"))
          print("V3 observed checkpoints:", wd.get("observed_checkpoint_rows"))
          print("V3 unique entry events:", wd.get("unique_entry_events"))
          print("V3 windows:", wd.get("window_count"))
          print("V3 positive windows:", wd.get("positive_delta_windows"))
          print("V3 positive-window fraction:", wd.get("positive_delta_fraction"))
          print("Synthetic values:", wd.get("synthetic_values"))
          PY

      - name: Publish real research datasets
        run: |
          set -euo pipefail
          git config user.name "Nexus SOL AI Discovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallet_discovery_multisource.json data/wallet_vybe_crosscheck.json data/wallet_identity_funding.json data/wallet_deep_research.json data/wallet_forward_performance.json data/wallet_evidence.json data/wallet_clusters.json data/wallet_forward_validation_v3.json
          if git diff --cached --quiet; then
            echo "No new research dataset changes."
            exit 0
          fi
          git commit -m "Run event-level wallet validation"
          git push origin main
