<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030712">
<title>NEXUS SOL AI — Live Intelligence</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#02050b;
  --panel:#07101d;
  --panel2:#091625;
  --line:#142b43;
  --text:#eef7ff;
  --muted:#7890a8;
  --green:#20f0a0;
  --cyan:#18d9ff;
  --blue:#4285ff;
  --purple:#8b5cff;
  --red:#ff5577;
}

html,body{
  margin:0;
  min-height:100%;
  background:#02050b;
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 0%,#09223a 0,#020812 35%,#01040a 80%);
}

.app{
  max-width:1550px;
  margin:auto;
  padding:18px;
}

/* ================= HEADER ================= */

.header{
  display:grid;
  grid-template-columns:310px 1fr;
  gap:15px;
  margin-bottom:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:76px;
  height:76px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#20f0a0,#18d9ff 48%,#7355ff);
  box-shadow:0 0 35px #18d9ff55;
}

.brand h1{
  margin:0;
  font-size:25px;
  letter-spacing:-1px;
}

.brand h1 span{
  color:var(--green);
}

.brand small{
  display:block;
  margin-top:5px;
  color:#829ab0;
  font-size:10px;
  letter-spacing:3px;
}

.livebar{
  min-height:76px;
  border:1px solid #123c50;
  border-radius:18px;
  background:linear-gradient(100deg,#061321,#071c2b);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 20px;
}

.live-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.live-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 18px var(--green);
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  50%{opacity:.35;transform:scale(.75)}
}

.live-title{
  color:var(--green);
  font-weight:800;
  letter-spacing:1px;
  font-size:13px;
}

.live-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.conf{
  text-align:right;
}

.conf span{
  color:var(--muted);
  font-size:10px;
  display:block;
}

.conf strong{
  color:var(--green);
  font-size:25px;
}

/* ================= LAYOUT ================= */

.layout{
  display:grid;
  grid-template-columns:190px 1fr;
  gap:15px;
}

/* ================= SIDEBAR ================= */

.sidebar{
  background:linear-gradient(180deg,#07111e,#030912);
  border:1px solid var(--line);
  border-radius:17px;
  padding:10px;
}

.nav{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  margin-bottom:4px;
  border-radius:9px;
  color:#8ca3b8;
  font-size:13px;
}

.nav.active{
  color:#fff;
  background:linear-gradient(90deg,#092c45,#071827);
  border-left:2px solid var(--cyan);
  box-shadow:0 0 20px #00d9ff12;
}

.nav-icon{
  width:20px;
  text-align:center;
  color:var(--cyan);
}

.engine{
  margin-top:20px;
  padding:13px;
  border:1px solid #12334b;
  border-radius:13px;
  text-align:center;
}

.engine-title{
  color:#738ba1;
  font-size:9px;
  letter-spacing:1.5px;
}

.online{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  border-radius:20px;
  color:var(--green);
  background:#063322;
  font-size:10px;
}

.ai-orb{
  height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:48px;
  color:var(--cyan);
  text-shadow:0 0 30px #009dff;
}

.quote
