 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020811">
<title>Nexus SOL AI — Live Intelligence</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#020811;
  --panel:#071321;
  --panel2:#0a1a2c;
  --line:#17324b;
  --text:#eff8ff;
  --muted:#8197ad;
  --green:#20f0a0;
  --cyan:#18d9ff;
  --blue:#4287ff;
  --purple:#8b5cff;
  --red:#ff5577;
}

html{background:var(--bg)}

body{
  margin:0;
  background:
    radial-gradient(circle at 72% 8%,#10365355 0,transparent 30%),
    radial-gradient(circle at 15% 60%,#08254144 0,transparent 32%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif
}

.app{
  max-width:1500px;
  margin:auto;
  padding:18px
}

.card{
  background:linear-gradient(145deg,#081827,#030b15);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 12px 40px #0008
}

.top{
  display:grid;
  grid-template-columns:310px 1fr;
  gap:16px;
  margin-bottom:16px
}

.brand{
  display:flex;
  align-items:center;
  gap:14px
}

.logo{
  width:76px;
  height:76px;
  border-radius:20px;
  display:grid;
  place-items:center;
  font-size:48px;
  font-weight:900;
  background:linear-gradient(135deg,#20f0a0,#18d9ff 48%,#7650ff);
  box-shadow:0 0 32px #18d9ff33,inset 0 0 18px #fff3
}

.brand h1{
  font-size:27px;
  margin:0;
  letter-spacing:-1px
}

.brand h1 span{
  display:block;
  color:var(--green)
}

.brand small{
  display:block;
  color:#91a8bd;
  letter-spacing:3px;
  font-size:10px;
  margin-top:5px
}

.live{
  border:1px solid #16465a;
  border-radius:18px;
  background:#061523;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 22px
}

.live-left{
  display:flex;
  align-items:center;
  gap:11px
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px var(--green)
}

.live strong{
  color:var(--green);
  letter-spacing:1px
}

.live p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px
}

.conf span{
  display:block;
  color:var(--muted);
  font-size:11px
}

.conf b{
  color:var(--green);
  font-size:26px
}

.layout{
  display:grid;
  grid-template-columns:185px 1fr;
  gap:16px
}

.sidebar{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,#061321,#030b15);
  padding:10px
}

.nav{
  padding:12px;
  border-radius:10px;
  color:#a9bdd0;
  font-size:13px;
  display:flex;
  gap:11px;
  margin-bottom:4px
}

.nav.active{
  background:#082c45;
  color:#fff;
  border-left:2px solid var(--cyan)
}

.engine,.quote{
  margin-top:20px;
  border:1px solid #14344c;
  border-radius:14px;
  padding:14px;
  text-align:center
}

.engine small{
  color:var(--muted);
  font-size:9px;
  letter-spacing:1px
}

.online{
  margin:9px auto;
  padding:6px 12px;
  width:max-content;
  border-radius:20px;
  background:#063525;
  color:var(--green);
  font-size:10px
}

.brain{
  height:115px;
  display:grid;
  place-items:center;
  font-size:54px;
  color:#19cfff;
  text-shadow:0 0 28px #008dff
}

.quote{
  color:#9aafc2;
  font-size:11px;
  line-height:1.6
}

.green{
  color:var(--green)!important
}

.cyan{
  color:var(--cyan)
}

.dashboard{
  min-width:0
}

.cards-top{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:16px
}

.signal{
  min-height:390px;
  position:relative;
  overflow:hidden;
  padding:20px
}

.signal h3{
  text-align:center;
  margin:0 0 10px;
  font-size:13px;
  letter-spacing:1px;
  color:#a8b8c7
}

.gauge{
  width:275px;
  height:275px;
  margin:auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:conic-gradient(
    from 215deg,
    var(--green),
    var(--cyan) 105deg,
    var(--blue) 175deg,
    var(--purple) 225deg,
    transparent 226deg 360deg
  );
  box-shadow:0 0 35px #00eaff22;
  position:relative
}

.gauge:before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  background:#020a13;
  box-shadow:inset 0 0 30px #00192b
}

.score{
  position:relative;
  text-align:center
}

.score b{
  display:block;
  font-size:78px;
  line-height:.9
}

.score span{
  color:#b6c7d7
}

.strong{
  margin-top:11px;
  color:var(--green);
  font-weight:800;
  font-size:13px
}

.badge{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  border:1px solid #116c54;
  background:#052419;
  color:var(--green);
  border-radius:30px;
  padding:8px 14px;
  font-size:10px;
  white-space:nowrap
}

.side-metrics{
  display:grid;
  gap:16px
}

.metric{
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.metric-left{
  display:flex;
  gap:12px;
  align-items:center
}

.metric-icon{
  font-size:26px
}

.metric label{
  display:block;
  color:#9cb0c2;
  font-size:11px;
  letter-spacing:1px
}

.metric strong{
  display:block;
  margin-top:4px;
  font-size:25px
}

.metric small{
  color:var(--green);
  font-size:10px
}

.mini-chart{
  width:100px;
  height:42px;
  position:relative;
  overflow:hidden
}

.mini-chart svg{
  width:100%;
  height:100%
}

.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:16px
}

.kpi{
  padding:17px;
  min-height:138px
}

.kpi-title{
  color:#8da4b8;
  font-size:10px;
  letter-spacing:2px
}

.kpi-value{
  font-size:31px;
  font-weight:800;
  margin-top:14px
}

.kpi-line{
  height:25px;
  margin-top:7px
}

.kpi small{
  color:#8ba0b4;
  font-size:10px
}

.lower{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:16px
}

.panel{
  padding:18px;
  min-height:320px
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px
}

.panel-head h3{
  margin:0;
  font-size:14px
}

.panel-head small{
  display:block;
  color:#71879b;
  font-size:10px;
  margin-top:4px
}

.select{
  border:1px solid #24435b;
  border-radius:8px;
  padding:6px 9px;
  color:#9cb0c2;
  font-size:10px
}

.bar-chart{
  height:205px;
  display:flex;
  align-items:end;
  gap:4px;
  border-bottom:1px solid #16354d;
  padding:0 7px
}

.bar{
  flex:1;
  min-width:3px;
  background:linear-gradient(to top,#086cff,#08d8ff);
  border-radius:3px 3px 0 0;
  box-shadow:0 0 7px #00aaff44
}

.bar.g{
  background:linear-gradient(to top,#06b86d,#20f0a0)
}

.axis{
  display:flex;
  justify-content:space-between;
  color:#61778b;
  font-size:9px;
  margin-top:7px
}

.table-wrap{
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:520px
}

th{
  text-align:left;
  color:#71879b;
  font-size:9px;
  padding:8px 5px;
  letter-spacing:1px
}

td{
  padding:10px 5px;
  border-top:1px solid #10283c;
  font-size:11px
}

.token{
  display:flex;
  align-items:center;
  gap:7px
}

.token-icon{
  width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#182a3e
}

.score-small{
  color:var(--green);
  border:2px solid var(--green);
  width:32px;
  height:32px;
  border-radius:50%;
  display:grid;
  place-items:center
}

.performance{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:18px
}

.perf strong{
  display:block;
  font-size:22px;
  margin-top:4px
}

.perf span{
  color:#71879b;
  font-size:9px
}

.line-chart{
  height:145px;
  border-bottom:1px solid #16354d;
  position:relative;
  overflow:hidden;
  background:repeating-linear-gradient(
    0deg,
    transparent 0 34px,
    #0d2435 35px
  )
}

.line-chart svg{
  width:100%;
  height:100%
}

.ai{
  display:flex;
  gap:18px;
  align-items:center
}

.ai-art{
  min-width:145px;
  height:145px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:60px;
  color:#1acfff;
  text-shadow:0 0 30px #008dff;
  background:radial-gradient(
    circle,
    #062b52,
    #020b15 65%
  )
}

.ai h2{
  color:var(--green);
  font-size:16px
}

.ai li{
  margin:8px 0;
  color:#9eb1c3;
  font-size:11px
}

.button{
  display:block;
  text-align:center;
  margin-top:16px;
  padding:12px;
  border-radius:9px;
  color:#fff;
  background:linear-gradient(90deg,#1857db,#7128d8)
}

.ticker{
  margin-top:16px;
  border:1px solid #17324b;
  border-radius:14px;
  background:#040d17;
  overflow:hidden;
  white-space:nowrap
}

.ticker-track{
  display:flex;
  width:max-content;
  animation:scroll 28s linear infinite
}

.tick{
  padding:13px 20px;
  border-right:1px solid #12283a;
  font-size:12px
}

.tick b{
  margin-left:5px
}

.up{
  color:var(--green)
}

.down{
  color:var(--red)
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

.footer{
  margin-top:12px;
  padding:12px 16px;
  border:1px solid #12314a;
  border-radius:13px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  color:#b0c0cf;
  font-size:11px
}

.healthy{
  color:var(--green)
}

@media(max-width:900px){

  .app{padding:10px}

  .top{
    grid-template-columns:1fr
  }

  .layout{
    grid-template-columns:1fr
  }

  .sidebar{
    display:none
  }

  .cards-top,
  .lower{
    grid-template-columns:1fr
  }

  .kpis{
    grid-template-columns:repeat(2,1fr)
  }

  .brand h1{
    font-size:22px
  }

  .logo{
    width:64px;
    height:64px;
    font-size:40px
  }

  .conf{
    display:none
  }

  .gauge{
    width:235px;
    height:235px
  }

  .score b{
    font-size:67px
  }
}

@media(max-width:520px){

  .signal{
    min-height:350px
  }

  .gauge{
    width:215px;
    height:215px
  }

  .score b{
    font-size:60px
  }

  .kpi{
    min-height:115px;
    padding:13px
  }

  .kpi-value{
    font-size:26px
  }

  .panel{
    padding:14px
  }

  .ai{
    flex-direction:column;
    align-items:flex-start
  }

  .ai-art{
    width:100%
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="brand">
    <div class="logo">N</div>

    <div>
      <h1>NEXUS <span>SOL AI</span></h1>
      <small>SOLANA SIGNAL INTELLIGENCE</small>
    </div>
  </div>

  <div class="live">

    <div class="live-left">
      <div class="dot"></div>

      <div>
        <strong>LIVE SCANNER</strong>
        <p id="scannerText">
          Connecting to live market data...
        </p>
      </div>
    </div>

    <div class="conf">
      <span>System Confidence</span>
      <b>87%</b>
    </div>

  </div>

</header>

<div class="layout">

<aside class="sidebar">

  <div class="nav active">⌂ Dashboard</div>
  <div class="nav">◉ Live Scanner</div>
  <div class="nav">◎ Signals</div>
  <div
