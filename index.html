<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020811">
<title>Nexus SOL AI — Live Intelligence</title>

<style>
*{box-sizing:border-box}
:root{--bg:#020811;--panel:#061321;--panel2:#081a2b;--line:#12304a;--text:#eef7ff;--muted:#8298ae;--green:#20f0a0;--cyan:#18d9ff;--blue:#258bff;--purple:#8b5cff;--red:#ff5577}

body{
margin:0;
background:radial-gradient(circle at 55% 15%,#08233a 0,#020811 42%,#01060c 100%);
color:var(--text);
font-family:Inter,Arial,sans-serif;
min-height:100vh
}

.app{max-width:1500px;margin:auto;padding:22px}

.top{display:grid;grid-template-columns:310px 1fr;gap:18px;margin-bottom:18px}

.brand{display:flex;align-items:center;gap:15px}

.logo{
width:82px;
height:82px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:54px;
font-weight:900;
color:#fff;
background:linear-gradient(135deg,#08f0c0,#168bff 55%,#713cff);
box-shadow:0 0 28px #09d9ff55,inset 0 0 20px #ffffff22
}

.brand h1{margin:0;font-size:28px;letter-spacing:-1px}
.brand h1 span{display:block;color:var(--green)}
.brand small{display:block;margin-top:6px;color:#91a8bd;letter-spacing:3px;font-size:11px}

.live{
border:1px solid #16465a;
border-radius:20px;
background:linear-gradient(90deg,#061523,#071c2c);
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 24px;
box-shadow:0 0 35px #00d9ff0d
}

.live-left{display:flex;align-items:center;gap:12px}

.dot,.market-live-dot{
background:var(--green);
border-radius:50%;
box-shadow:0 0 18px var(--green)
}

.dot{
width:12px;
height:12px;
animation:pulse 1.6s infinite
}

@keyframes pulse{
50%{box-shadow:0 0 28px var(--green);opacity:1}
100%{opacity:.7}
}

.live strong{color:var(--green);letter-spacing:1px}
.live p{margin:5px 0 0;color:var(--muted);font-size:13px}

.conf{display:flex;align-items:center;gap:20px}
.conf span{color:var(--muted);font-size:12px}
.conf b{color:var(--green);font-size:27px}

.layout{display:grid;grid-template-columns:185px 1fr;gap:18px}

.sidebar{
border:1px solid var(--line);
border-radius:18px;
background:linear-gradient(180deg,#061321,#030b15);
padding:12px
}

.nav{
padding:13px;
margin-bottom:5px;
border-radius:10px;
color:#a9bdd0;
font-size:14px;
display:flex;
align-items:center;
gap:12px
}

.nav.active{
background:linear-gradient(90deg,#082c45,#071827);
color:#fff;
border-left:2px solid var(--cyan)
}

.nav span{font-size:18px}

.engine{
margin-top:25px;
padding:15px 10px;
border:1px solid #14344c;
border-radius:14px;
text-align:center
}

.engine small{
color:var(--muted);
font-size:10px;
letter-spacing:1px
}

.online{
margin:10px auto;
width:max-content;
padding:7px 13px;
border-radius:20px;
color:var(--green);
background:#063525;
font-size:11px
}

.brain{
height:130px;
display:flex;
align-items:center;
justify-content:center;
font-size:65px;
color:#13caff;
text-shadow:0 0 15px #08cfff,0 0 40px #006cff
}

.quote{
margin-top:25px;
border:1px solid #14344c;
border-radius:14px;
padding:18px;
color:#9aaf
