<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus SOL AI</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#050914;
color:#edf4ff;
font-family:Arial,sans-serif;
}
header{
padding:18px 22px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #182338;
background:#08101e;
position:sticky;
top:0;
z-index:10;
}
.logo{
font-size:24px;
font-weight:900;
letter-spacing:.5px;
}
.logo span{color:#35e6a2}
.live{
color:#35e6a2;
font-size:12px;
font-weight:bold;
}
main{
max-width:1200px;
margin:auto;
padding:24px 16px;
}
h1{
font-size:34px;
margin:0 0 8px;
}
.subtitle{
color:#8290a8;
margin-bottom:20px;
}
.badge{
display:inline-block;
padding:7px 11px;
border:1px solid #30405c;
border-radius:8px;
color:#35e6a2;
font-size:11px;
margin-bottom:22px;
}
.kpis{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}
.card{
background:linear-gradient(145deg,#0b1425,#07101d);
border:1px solid #1b2b43;
border-radius:16px;
padding:18px;
margin-bottom:14px;
box-shadow:0 10px 30px #0005;
}
.label{
font-size:11px;
color:#8290a8;
text-transform:uppercase;
letter-spacing:1px;
}
.number{
font-size:28px;
font-weight:900;
margin-top:8px;
}
.green{color:#35e6a2}
.yellow{color:#ffd166}
.red{color:#ff5d73}
.blue{color:#55a8ff}

.grid{
display:grid;
grid-template-columns:1.4fr .8fr;
gap:14px;
margin-top:14px;
}
.signal{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid #182338;
}
