<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050816"><title>Nexus SOL AI — Token Intelligence</title><style>:root{--bg:#050816;--p:#0b1221;--line:#1b2940;--text:#f4f7ff;--muted:#8193aa;--cyan:#5ee7ff;--green:#42e6a4;--violet:#a889ff;--amber:#ffc85a;--red:#ff667a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 65% -10%,#17265c55,transparent 60%),var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:20px;font-weight:950}.brand b{color:var(--cyan)}a,button{color:#dcecff;background:#0b1525;border:1px solid #263750;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer;font-weight:850}.hero,.card{border:1px solid var(--line);background:linear-gradient(145deg,#0b1221,#080e19);border-radius:18px}.hero{padding:22px}.eyebrow{color:var(--cyan);font-size:10px;font-weight:950;letter-spacing:1.4px}.hero h1{font-size:34px;margin:8px 0}.mint{font:11px ui-monospace,monospace;color:#8095ae;word-break:break-all}.chips,.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:7px 10px;border:1px solid #263750;border-radius:999px;background:#0b1525;color:#c8d6e8;font-size:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.card{padding:15px}.label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#72849d;font-weight:950}.num{font-size:23px;font-weight:950;margin-top:6px}.green{color:var(--green)}.cyan{color:var(--cyan)}.violet{color:var(--violet)}.amber{color:var(--amber)}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 9px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{padding:11px;background:#091321;border:1px solid #18283e;border-radius:11px}.fact small{display:block;color:#72849d}.fact b{display:block;margin-top:5px}.socials{display:grid;gap:8px}.socials a{display:block}.loading{color:#7f91aa}.warn{color:var(--amber)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}.hero h1{font-size:28px}.wrap{padding:12px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:8px;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div class="brand">Nexus <b>SOL AI</b> · Token Intelligence</div><a href="./">← Dashboard</a></div><section class="hero"><div class="eyebrow">TOKEN HYPE / INTELLIGENCE PROFILE</div><h1 id="name">Loading…</h1><div class="mint" id="mint"></div><div class="chips" id="chips"></div><div class="links" id="links"></div></section><section class="grid" id="kpis"></section><section class="section"><h2>Market & AI Intelligence</h2><div class="card"><div class="facts" id="facts"></div></div></section><section class="section"><h2>Project website & social presence</h2><div class="card"><div class="socials" id="socials"><span class="loading">Loading public metadata…</span></div></div></section><section class="section"><h2>Risk / hype assessment</h2><div class="card" id="risk"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search);const mint=q.get('mint')||q.get('address');const sym=q.get('symbol')||'Token';const money=v=>v==null?'N/A':typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:2}):v;const link=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`:'';async function main(){if(!mint){document.getElementById('name').textContent='No token address';return}let d={},pairs=[];try{d=await fetch('data/dashboard.json?ts='+Date.now()).then(r=>r.json())}catch(e){}const c=(d.intelligence?.top_candidates||[]).find(x=>x.mint===mint);const s=(d.signals||[]).find(x=>(x.address||x.mint)===mint);const name=c?.symbol||s?.symbol||sym;document.getElementById('name').textContent=name;document.getElementById('mint').textContent=mint;const score=c?.core_score??s?.score;document.getElementById('chips').innerHTML=[score!=null?`<span class="chip">AVIRENE5 Score <b>${money(score)}</b></span>`:'',c?`<span class="chip">Quality ${money(c.quality_score)}</span>`:'',c?`<span class="chip">Risk ${money(c.risk_score)}</span>`:'',c?`<span class="chip">Edge ${money(c.edge_score)}</span>`:'',`<span class="chip">PAPER / SIMULATION</span>`].join('');document.getElementById('links').innerHTML=[link('https://solscan.io/token/'+encodeURIComponent(mint),'Solscan'),link('https://dexscreener.com/solana/'+encodeURIComponent(mint),'DexScreener'),link('https://birdeye.so/token/'+encodeURIComponent(mint)+'?chain=solana','Birdeye'),link('https://jup.ag/swap/SOL-'+encodeURIComponent(mint),'Jupiter')].join('');document.getElementById('kpis').innerHTML=[['Score',score,'cyan'],['Momentum',s?.momentum,'green'],['Liquidity',s?.liquidity,'green'],['Decision',s?.decision||'WATCH','violet']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${x[2]}">${esc(x[1]??'N/A')}</div></div>`).join('');document.getElementById('facts').innerHTML=[['Engine reason',s?.reason||'Candidate monitoring'],['Signal time',s?.timestamp?new Date(s.timestamp).toLocaleString():'N/A'],['Quality score',c?.quality_score],['Risk score',c?.risk_score],['Edge score',c?.edge_score],['Flags',(c?.flags||[]).join(', ')||'None'],['Market regime',d.intelligence?.regime],['Data quality',d.intelligence?.data_quality==null?'N/A':d.intelligence.data_quality+'%']].map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1]??'N/A')}</b></div>`).join('');try{const r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(mint));const j=await r.json();pairs=(j.pairs||[]).sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));}catch(e){}const p=pairs[0];if(p){const websites=p.info?.websites||[];const socials=p.info?.socials||[];document.getElementById('facts').insertAdjacentHTML('beforeend',[['DEX pair',p.baseToken?.symbol+'/'+p.quoteToken?.symbol],['Price USD',p.priceUsd],['Liquidity USD',p.liquidity?.usd],['FDV',p.fdv],['Volume 24H',p.volume?.h24],['Price change 24H',p.priceChange?.h24+'%']].map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1]??'N/A')}</b></div>`).join(''));const links=[...websites.map(x=>link(x.url,'🌐 '+(x.label||'Website'))),...socials.map(x=>link(x.url,'🔗 '+(x.type||'Social')))].filter(Boolean);document.getElementById('socials').innerHTML=links.length?links.join(''):'<span class="loading">No public website/social metadata returned by the market-data provider.</span>';document.getElementById('risk').innerHTML=(c?.flags||[]).length?`<div class="warn">⚠ ${esc(c.flags.join(' · '))}</div>`:'<div>✓ No engine risk flags on the current snapshot. This is not a safety guarantee.</div>';}else{document.getElementById('socials').innerHTML='<span class="loading">No live DEX metadata available right now.</span>';document.getElementById('risk').innerHTML='<div class="warn">Live market metadata unavailable. Core engine data remains Paper / Simulation.</div>';}}main();</script></body></html>
